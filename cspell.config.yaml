dictionaryDefinitions:
  - name: fenicsx_beat
    path: .cspell_dict.txt
    addWords: true
dictionaries:
  - fenicsx_beat
ignorePaths: [
    # Vendored, verbatim copies of odes/**/*.ode (never spell-checked there either, since
    # cspell's pre-commit hook only scans src/|docs|tests|README.md) shipped as CLI template
    # companions; their many third-party cell-model variable abbreviations aren't prose.
    "src/beat/cli/templates/**/*.ode",
  ]
ignoreWords: [
    quickstart,
    toctree,
    maxdepth,
    genindex,
    modindex,
    mathbf,
    mathrm,
    mathbb,
    mathcal,
    operatorname,
    docname,
    docnames,
    automodule,
    endoo
  ]

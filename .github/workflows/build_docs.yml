name: Build documentation

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

env:
  DEB_PYTHON_INSTALL_LAYOUT: deb_system

jobs:

  build:
    runs-on: ubuntu-22.04
    container: ghcr.io/fenics/dolfinx/lab:stable
    env:
      PUBLISH_DIR: ./_build/html
      PYVISTA_OFF_SCREEN: false
      PYVISTA_JUPYTER_BACKEND: "html"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies for pyvista
        run: |
          apt-get update && apt-get install -y libxrender1

      - name: Install dependencies
        run: |
          python3 -m pip install -r https://raw.githubusercontent.com/scientificcomputing/scifem/refs/heads/main/build-requirements.txt
          python3 -m pip install scifem --no-build-isolation
          python3 -m pip install ".[docs]"
          # PyPI's irksome release has a bug in its dolfinx backend (it always
          # resolves to the firedrake backend internally), so pull the fix from
          # git HEAD. Keep the [dolfinx] extra so firedrake-fiat (required by
          # irksome, even with the dolfinx backend) is installed alongside it.
          python3 -m pip install "irksome[dolfinx] @ git+https://github.com/firedrakeproject/Irksome.git"


      - name: Build docs
        run: jupyter book build -W --keep-going .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PUBLISH_DIR }}

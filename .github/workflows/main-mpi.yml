name: Test package (MPI)

on:
  pull_request:
  push:
    branches: [main]

jobs:

  test-code:
    # This code depends on the result of check-code
    runs-on: ubuntu-latest
    timeout-minutes: 10   # Tests shouldn't use more than 10 minutes to run
    container:
      image: ghcr.io/fenics/dolfinx/dolfinx:stable


    steps:
      - uses: actions/checkout@v7

      - name: Install build requirements
        run: |
          python3 -m pip install --group build

      - name: Install package
        run: |
          python3 -m pip install scifem --no-build-isolation
          python3 -m pip install -e .[test,external_operator]
          # PyPI's irksome release has a bug in its dolfinx backend (it always
          # resolves to the firedrake backend internally), so pull the fix from
          # git HEAD. Keep the [dolfinx] extra so firedrake-fiat (required by
          # irksome, even with the dolfinx backend) is installed alongside it.
          python3 -m pip install "irksome[dolfinx] @ git+https://github.com/firedrakeproject/Irksome.git"

      - name: Run tests
        run: mpirun -n 2 python3 -m pytest -v  -m "not skip_in_parallel"

      - name: CLI restart on a different number of ranks
        run: |
          beat init /tmp/cli-restart/config.toml --template diffusion
          beat run /tmp/cli-restart/config.toml --set 'solver.end_time="0.5 ms"'
          mpirun -n 2 beat run /tmp/cli-restart/config.toml --restart --set 'solver.end_time="1.0 ms"'
          python -c "import json; assert json.load(open('/tmp/cli-restart/output/run.json'))['status'] == 'finished'"

[build-system]
requires = [
    "scikit-build-core[pyproject]>=0.11.0", # Ensuring license field is correctly parsed]
    "nanobind>=1.3.2",
    "setuptools>=77.0.3",                   # Ensuring license field is correctly parsed]
    "packaging>=24.2",                      # Ensuring license field is correctly parsed]
    "pkgconfig",
]

[project]
name = "fenicsx-beat"
version = "0.6.1"
description = "Library to run cardiac EP simulations"
authors = [{name = "Henrik Finsberg", email = "henriknf@simula.no"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.8"
keywords = ["cardiac", "electrophysiology"]
dependencies = [
    "numpy",
    "scipy",
    "scifem>=0.2.14",
    "pint",
    "rich",
    "fenics-dolfinx",
    "packaging",
]

[project.scripts]
beat = "beat.cli:main"

[project.urls]
Homepage = "https://finsberg.github.io/fenicsx-beat"
Documentation = "https://finsberg.github.io/fenicsx-beat"
Source = "https://github.com/finsberg/fenicsx-beat"
Tracker = "https://github.com/finsberg/fenicsx-beat/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "fenicsx-beat[irksome]",
]
dev = [
    "pdbpp",
    "ipython",
    "bump-my-version",
    "pre-commit",
    "mypy",
    "fenicsx-beat[test]",
    "fenicsx-beat[docs]",
]
pypi = [
    "twine",
    "build"
]
irksome = [
    "irksome[dolfinx]",
]
external_operator = [
    "dolfinx-external-operator",
]
demos = [
   "cardiac-geometriesx",
   "fenicsx-ldrb",
   "gotranx",
   "ukb-atlas",
   "io4dolfinx",
   "jax[cpu]",
]
docs = [
   "jupyter-book<2.0",
   "jupytext",
   "fenicsx-beat[demos]",
   "fenicsx-beat[irksome]",
   "fenicsx-beat[external_operator]",
   "ipywidgets",
   "imageio",
   "pyvista[all]>=0.45.0",
   "vtk>=9.5.0",
   "pyvista[jupyter]",
   "sphinx-codeautolink",
   "sphinxcontrib-bibtex",
    "sphinx-copybutton",
]
all = [
   "fenicsx-beat[test]",
   "fenicsx-beat[docs]",
   "fenicsx-beat[pypi]",
   "fenicsx-beat[dev]",
   "fenicsx-beat[demos]"
]


[dependency-groups]
# Keep in sync with [build-system].requires above. Needed as a group, not just
# as build-system metadata, because scifem is installed with
# `--no-build-isolation`, so the build backend has to already be present.
build = [
    "scikit-build-core[pyproject]>=0.11.0",
    "nanobind>=1.3.2",
    "setuptools>=77.0.3",
    "packaging>=24.2",
    "pkgconfig",
]


[tool.pytest.ini_options]
testpaths = [
    "tests"
]
markers = [
    "skip_in_parallel: test cannot be run under multi-rank MPI",
]

[[tool.mypy.overrides]]
# Third-party packages without type information, and cell models the demos generate at runtime.
module = [
    "scipy.*",
    "numba.*",
    "scifem.*",
    "irksome.*",
    "dolfinx_external_operator.*",
    "tentusscher_panfilov_2006_epi_cell",
    "ToRORd_dynCl_endo",
    "ms_cell_model",
    "ms_jax_monolithic",
    "ms_np_monolithic",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Plotting-only APIs whose annotations reject valid calls: `vtk_mesh` is a singledispatch
# function annotated for `Mesh` only, and pyvista's positional-args deprecation decorator
# hides the `self` binding of methods such as `view_xy`.
module = ["pyvista.*", "dolfinx.plot"]
follow_imports = "skip"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    "demo/*.py",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "demos",
]

# Same as Black.
line-length = 100

# Allow unused variables when underscore-prefixed.

# Assume Python 3.10.
target-version = "py310"


[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "I"]
ignore = ["E402", "E741", "E743", "E731"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "I"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10


[tool.ruff.lint.isort]
known-first-party = ["beat"]
known-third-party = [
    "basix",
    "dolfinx",
    "ffcx",
    "ufl",
    "gmsh",
    "numpy",
    "pytest",
]
section-order = [
    "future",
    "standard-library",
    "mpi",
    "third-party",
    "first-party",
    "local-folder",
]
[tool.ruff.lint.isort.sections]
"mpi" = ["mpi4py", "petsc4py"]


[tool.bumpversion]
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
current_version = "0.6.1"


[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
